# Weekly dependency updates, grouped so one PR per ecosystem carries the week's bumps.
# CI (typecheck, unit tests, example flow) gates each PR; nothing merges on its own.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-dependencies:
        patterns: ["*"]
    # Toolchain majors are moved by hand: TypeScript 7 drops `baseUrl` (TS5102), which the
    # workspace tsconfigs use, and @types/node follows the Node versions CI tests (22, 24).
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
